name: rebuild-catpaw
on:
  schedule:
    - cron: '40 19 * * 0'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Build official catpaw bundle
        run: |
          set -eu
          curl -fsSL -o /tmp/catpaw.zip https://codeload.github.com/CatPawApp/CatPawOpen/zip/refs/heads/main
          unzip -q /tmp/catpaw.zip -d /tmp/catpaw
          cd /tmp/catpaw/CatPawOpen-main/nodejs
          npm i --no-audit --no-fund --registry=https://registry.npmmirror.com
          npm run build
          mkdir -p "$GITHUB_WORKSPACE/catpaw"
          cp dist/index.js dist/index.js.md5 dist/index.config.js dist/index.config.js.md5 "$GITHUB_WORKSPACE/catpaw/"
      - name: Commit if changed
        run: |
          git config user.name "ysc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catpaw/
          git diff --cached --quiet && { echo 'no changes'; exit 0; }
          git commit -m "catpaw: rebuild $(date -u +'%F %T')"
          git push
