name: mirror-config
on:
  schedule:
    - cron: '30 19 * * 0'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull latest config
        env:
          MAIN_URL: https://ysc.tengxuntaobao.win/
        run: |
          set -eu
          code=$(curl -sL -m 120 -A 'okhttp/3.12.13' -w '%{http_code}' -o tvbox.json "$MAIN_URL" || true)
          echo "HTTP $code, size: $(wc -c < tvbox.json)"
          grep -q '"sites"' tvbox.json || { echo 'invalid/plain-json only, skip commit'; exit 0; }
      - name: Commit mirror
        run: |
          git config user.name "ysc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tvbox.json
          git diff --cached --quiet && { echo 'no changes'; exit 0; }
          git commit -m "mirror: $(date -u +'%F %T') UTC"
          git push
